name: ReleaseBuild
on:
  push:
    branches:
      - master
env:
  #
  SOLUTION_FILE_PATH: DirectXGame/DirectXGame.sln
  #
  CONFIGURATION: Release

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/cheacout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-arachitecture: x64

      - name: Build
         run: |
           msbuild${{env.SOLUTION_FILE_PATH}} /p:Platform=x64,Configuration=${{env.CONFIGURATION}}
