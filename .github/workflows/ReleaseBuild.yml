name: ReleaseBuild
on:
  push:
    branches:
      - master
env:
  # リポジトリのルートディレクトリを基点としたソリューションファイルのパス
  SOLUTION_FILE_PAHT: project/DirectXGame.sin
  # Visual Studioの構成（Release）
  CONFIGURATION: Release
jobs:
  build:
    runs-on: windows- 2022

    steps:
      - name: Checkout
        uses: action/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Build
         run:
           msbuild ${{env.SOLUTION_FILE_PATH}} /p:Platformx=64,Configuration=${{env.CONFIGRATION}}
